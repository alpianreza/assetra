<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Assetra — Asset & Compliance Management</title>
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var mode = localStorage.getItem('assetra-theme') || 'system';
          var accent = localStorage.getItem('assetra-accent') || 'blue';
          var resolved = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
          var radius = Math.min(24, Math.max(4, Number(localStorage.getItem('assetra-radius')) || 8));
          root.classList.add(resolved); root.dataset.theme = resolved; root.dataset.accent = accent; root.dataset.direction = localStorage.getItem('assetra-direction') || 'ltr'; root.dataset.layout = localStorage.getItem('assetra-layout') || 'vertical'; root.dataset.container = localStorage.getItem('assetra-container') || 'full'; root.dataset.sidebar = localStorage.getItem('assetra-sidebar') === 'collapse' || localStorage.getItem('assetra-sidebar') === 'collapsed' ? 'collapse' : 'full'; root.dataset.cardStyle = localStorage.getItem('assetra-card-style') || 'border'; root.dir = root.dataset.direction; root.style.colorScheme = resolved; root.style.setProperty('--radius', radius + 'px');
        } catch (_) { document.documentElement.classList.add('light'); }
      })();
    </script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
